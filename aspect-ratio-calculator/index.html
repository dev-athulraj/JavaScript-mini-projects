<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Aspect Ratio Calculator</title>
  </head>
  <body>
    <div class="container">
      <h2>Aspect Ratio <span>Calculator</span></h2>

      <div class="ratio-inputs">
        <div class="ratio-group">
          <input type="number" id="ratio-width" value="16" min="1" />
          <span>:</span>
          <input type="number" id="ratio-height" value="9" min="1" />
        </div>
      </div>

      <div class="dimensions">
        <div class="input-wrapper">
          <label for="width">Width</label>
          <input type="number" id="width" value="1280" min="1" />
        </div>
        <div class="input-wrapper">
          <label for="height">Height</label>
          <input type="number" id="height" value="720" min="1" />
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
